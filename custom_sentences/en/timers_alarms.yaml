language: en
# Comprehensive phrasings mapped to HA's built-in timer intent NAMES, which our
# integration OVERRIDES (see intents.py) so they hit OUR store/ring/tones.
# We DO NOT rely on HA's built-in sentences (their coverage is quirky/context-
# gated — bare "how much time is left" stopped matching once we overrode the
# handler). Shipping our own set guarantees coverage; built-in sentences that DO
# match also route to our handlers (bonus). Device-exact via intent_obj.device_id.
intents:
  HassStartTimer:
    data:
      - sentences:
          - "set a timer for {minutes} minute[s]"
          - "set a {minutes} minute timer"
          - "start a timer for {minutes} minute[s]"
          - "set a timer for {seconds} second[s]"
          - "set a {seconds} second timer"
          - "set a timer for {hours} hour[s]"
          - "set a timer for {hours} hour[s] [and] {minutes} minute[s]"
          - "set a timer for {minutes} minute[s] [and] {seconds} second[s]"
      - sentences:
          - "set a {name} timer for {minutes} minute[s]"
          - "set a {minutes} minute {name} timer"
          - "start a {name} timer for {minutes} minute[s]"

  HassTimerStatus:
    data:
      - sentences:
          - "how much time is left"
          - "how much time is left on [the] timer"
          - "how long is left [on the timer]"
          - "how much [time] is left on [the] {name} timer"
          - "what timers are running"
          - "what timers are set"
          - "how many timers are running"
          - "timer status"
          - "check [the] timer"

  HassCancelTimer:
    data:
      - sentences:
          - "stop"
          - "cancel"
          - "cancel [the|my] timer"
          - "stop [the|my] timer"
          - "delete [the|my] timer"
          - "cancel [the|my] {name} timer"
          - "stop [the|my] {name} timer"

  HassCancelAllTimers:
    data:
      - sentences:
          - "cancel all [the|my] timers"
          - "stop all [the|my] timers"
          - "clear all [the|my] timers"

lists:
  hours:
    range:
      from: 1
      to: 24
  minutes:
    range:
      from: 1
      to: 600
  seconds:
    range:
      from: 1
      to: 600
  name:
    wildcard: true
