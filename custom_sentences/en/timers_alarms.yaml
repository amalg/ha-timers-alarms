language: en
# Phrasings mapped to HA's built-in timer intent NAMES, which our integration
# OVERRIDES (see intents.py) so they hit OUR store/ring/tones. Device-exact via
# intent_obj.device_id. No free-text names (per design): timers are referenced by
# ORDINAL/index ("timer 1", "the first timer") or by original DURATION ("the 20
# minute timer") — robust against STT word-misrepresentation.
intents:
  HassStartTimer:
    data:
      - sentences:
          - "set a timer for {minutes} minute[s]"
          - "set a {minutes} minute timer"
          - "start a timer for {minutes} minute[s]"
          - "set a timer for {seconds} second[s]"
          - "set a {seconds} second timer"
          - "set a timer for {hours} hour[s]"
          - "set a timer for {hours} hour[s] [and] {minutes} minute[s]"
          - "set a timer for {minutes} minute[s] [and] {seconds} second[s]"

  HassTimerStatus:
    data:
      - sentences:  # list everything
          - "what timers are running"
          - "what timers are set"
          - "what timers do i have"
          - "list [my|all] timers"
          - "list all my timers"
          - "are there any timers running"
          - "are there any timers set"
          - "do i have any timers running"
          - "do i have any timers"
          - "how many timers are running"
          - "timer status"
          - "how much time is left"
          - "how much time is left on [the] timer"
          - "how long is left [on the timer]"
      - sentences:  # a specific timer
          - "how much [time] is left on timer {index}"
          - "how long [is left] on timer {index}"
          - "how much [time] is left on [the] {ordinal} timer"
          - "how much [time] is left on [the|my] {minutes} minute timer"
          - "how much [time] is left on [the|my] {hours} hour timer"

  HassCancelTimer:
    data:
      - sentences:  # bare + the (single) timer
          - "stop"
          - "cancel"
          - "cancel [the|my] timer"
          - "stop [the|my] timer"
          - "delete [the|my] timer"
      - sentences:  # by index / ordinal
          - "cancel timer {index}"
          - "stop timer {index}"
          - "delete timer {index}"
          - "cancel [the] {ordinal} timer"
          - "stop [the] {ordinal} timer"
      - sentences:  # by original duration
          - "cancel [the|my] {minutes} minute timer"
          - "stop [the|my] {minutes} minute timer"
          - "cancel [the|my] {hours} hour timer"
          - "stop [the|my] {hours} hour timer"
          - "cancel [the|my] {seconds} second timer"
          - "stop [the|my] {seconds} second timer"

  HassCancelAllTimers:
    data:
      - sentences:
          - "cancel all [the|my] timers"
          - "stop all [the|my] timers"
          - "clear all [the|my] timers"

lists:
  hours:
    range: {from: 1, to: 24}
  minutes:
    range: {from: 1, to: 600}
  seconds:
    range: {from: 1, to: 600}
  index:
    range: {from: 1, to: 20}
  ordinal:
    values:
      - in: "first"
        out: 1
      - in: "1st"
        out: 1
      - in: "second"
        out: 2
      - in: "2nd"
        out: 2
      - in: "third"
        out: 3
      - in: "3rd"
        out: 3
      - in: "fourth"
        out: 4
      - in: "4th"
        out: 4
      - in: "fifth"
        out: 5
      - in: "5th"
        out: 5
