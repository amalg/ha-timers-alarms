language: en
# Broad phrasing coverage for HA's classic (no-LLM) hassil matcher. Mapped to
# HA's built-in timer intent NAMES, which our integration OVERRIDES (intents.py)
# so everything hits OUR store/ring/tones. Device-exact via intent_obj.device_id.
#
# M3: timer / alarm / alert are INTERCHANGEABLE keywords — the handler decides
# timer vs alarm from the KIND OF TIME. A duration ("for 20 minutes") -> timer;
# a time-of-day ("for 3 pm", "at 7:30", "half past 6") -> one-shot alarm. No
# free-text names (STT-misfire hygiene) — reference by number / ordinal /
# duration / alarm time.

expansion_rules:
  # units: singular / plural / abbreviations
  min: "(minute | minutes | minute's | min | mins)"
  sec: "(second | seconds | second's | sec | secs)"
  hr: "(hour | hours | hour's | hr | hrs)"
  # a DURATION expression -> fills {hours}/{minutes}/{seconds}
  dur: "({hours} <hr> [and] {minutes} <min> | {hours} <hr> | {minutes} <min> [and] {seconds} <sec> | {minutes} <min> | {seconds} <sec>)"
  # a TIME-OF-DAY expression -> fills {time_hour}/{time_minute}/{meridiem}/{named_time}/{past_min}/{to_min}
  oclock: "(o'clock | oclock | o clock)"
  # NB: a bare "{time_hour} [{meridiem}]" is a valid time-of-day (e.g. "for 6" ->
  # 6 o'clock, nearest future). Durations always carry a unit word (min/sec/hr),
  # so "for 6 minutes" still parses as a timer — the leftover "minutes" makes the
  # bare-hour alt fail to match the whole sentence, and hassil takes the duration.
  tod: "({named_time} | {past_min} {time_hour} [{meridiem}] | {to_min} {time_hour} [{meridiem}] | {time_hour} <oclock> [{meridiem}] | {time_hour}:{time_minute} [{meridiem}] | {time_hour} {time_minute} [{meridiem}] | {time_hour} [{meridiem}])"
  # interchangeable keyword (singular / plural)
  kw: "(timer | alarm | alert)"
  kws: "(timers | alarms | alerts | timers and alarms | alarms and timers | timers or alarms | alarms or timers | timers and alerts | alerts and timers | alarms and alerts)"
  # verbs
  setv: "(set | start | create | make | begin | add | put on | give me | set me | start me | wake me [up] | i want | i'd like | i need | can you set | could you set | can you start | please set | please start | put)"
  canv: "(cancel | stop | delete | remove | kill | end | abort | scrap | clear | get rid of | turn off | shut off)"
  askv: "(what | which | list | show me | show | tell me | tell me about | read me | read | check | how many | do i have | are there | is there | are there any | got any)"
  # STT prepends conversational filler ("Let's see what timers…"); swallow it.
  lead: "[(let's see | let me see | lets see | let's check | ok | okay | alright | so | um | uh | well | hey | hi | now | please | yeah | and)]"
  # 'the timer/alarm' (singular)
  thealert: "[the | my | that | a] <kw>"
  # a specific reference (number / ordinal / duration / alarm time)
  ref: "(<kw> {index} | number {index} | [the] {ordinal} [<kw>] | [the | my] <dur> <kw> | [the | my] <tod> <kw> | [the | my] <kw> (for | at) <tod>)"

intents:
  HassStartTimer:
    data:
      - sentences:  # DURATION -> timer
          - "<setv> [a | an | the | me a | myself a] <kw> for <dur>"
          - "<setv> [a | an | the] <dur> <kw>"
          - "<setv> [a | an | the] <kw> <dur>"
          - "[i want to] set [a | an] <dur> <kw>"
      - sentences:  # TIME-OF-DAY -> one-shot alarm. The time is a WILDCARD parsed
          # in Python (util.parse_when), because the STT engine is out of our
          # control and can emit any notation (7 p.m. / 7:00 / 700 / seven pm).
          # Durations still parse as timers (parse_when detects unit words).
          - "<setv> [a | an | the | me a | myself a] <kw> (for | at) {when}"
          - "<setv> [a | an | the] <kw> {when}"
          - "(wake me [up] | get me up) [at | by] {when}"

  HassTimerStatus:
    data:
      - sentences:  # list / enumerate everything
          - "<askv> [(my | all | all my | the | any)] <kws> [(there | running | set | going | active | left | on | up | do i have | do i have running | have i got | are mine)]"
          - "<askv> <kws> are (there | running | set | going | active | left | up)"
          - "(what | which) <kws> (do i have | have i got | are mine) [(running | set | going | left)]"
          - "how many <kws> [(are there | are running | are set | are going | do i have | have i got)]"
          - "any <kws> [(running | going | set | left)]"
          - "[what is | what's] [my | the] (timer | alarm | alert) status"
          - "(check | how are | what about) [my | the] <kws>"
          - "what's (on | left on | going on with) [my | the] <kws>"
      - sentences:  # STT often drops the leading "what/which" -> "timers are set"
          - "[(my | all | all my | the | any | are there | are there any | do i have any | got any)] <kws> [are] (set | running | going | active | left | on | up | there | left to go)"
          - "<kws> [that] [are] (set | running | going | active | left | on | up)"
          - "(any | are there | are there any | do i have any | have i got any) <kws>"
      - sentences:  # with leading STT filler ("let's see what timers are set")
          - "<lead> <askv> [(my | all | all my | the | any)] <kws> [(set | running | going | active | left | there | up | on | do i have)]"
          - "<lead> <kws> [are] (set | running | going | active | left | up | there)"
          - "<lead> (what | which) <kws> [(are | do i have | i have)] [(set | running | going | left)]"
          - "<lead> how many <kws> [(are set | are running | do i have)]"
      - sentences:  # time-left, general (the keyword is optional)
          - "how (much | much time | long | much longer | much time is | long is) [is] [left | remaining | to go | until it goes off] [[on] <thealert>]"
          - "how much [time] [is] [left | remaining] [[on] <thealert>]"
          - "(time | time left | time remaining | how long) [left | remaining] [[on] <thealert>]"
          - "when (is | does | will) [<thealert> | it] (go off | done | up | finish | end | be done | be up)"
          - "[<lead>] what time (is | are | does) [(it | they | the | my | the alarm | the timer | my alarm | my timer)] (set | set for | go off | going off | due)"
      - sentences:  # a specific one
          - "how (much | much time | long | much longer) [is] [left | remaining | to go] [on] <ref>"
          - "when (is | does | will) <ref> (go off | done | up | finish | end | be done)"

  HassCancelTimer:
    data:
      - sentences:  # dismissal — tolerant of STT noise/filler while a ring blares
          # (barge-in over the alert often mis-captures a leading word: "No. Stop.")
          - "[(no | nope | okay | ok | yeah | yes | um | uh | oh | ah | hey | well | please | alright | just | i said | now | ugh | god)] (stop | stop it | stop that | stop the timer | stop the alarm | cancel | cancel it | cancel that | nevermind | never mind | dismiss | dismiss it | shut up | be quiet | enough | that's enough | make it stop | knock it off | turn it off | shut it off) [(please | now | already | it | the timer | the alarm)]"
      - sentences:  # the (single) timer/alarm
          - "<canv> <thealert>"
          - "<canv> [the | my] (running | current | active) <kw>"
      - sentences:  # a specific one
          - "<canv> <ref>"

  # Plural (even with just one set) => cancel all. Quantifier optional, so
  # "cancel alarms" / "stop timers" / "clear the alerts" all match; singular
  # "cancel timer/alarm" stays with CancelTimer (the single one).
  HassCancelAllTimers:
    data:
      - sentences:
          - "<canv> [(all | all the | all my | all of the | all of my | every | each | my | the)] <kws>"
          - "(cancel | clear | delete | remove | stop | wipe | reset) everything"
          - "(clear | reset | wipe | kill) [all] [of] [my | the] <kws>"
          - "get rid of [(all | all my | all the | every | my | the)] <kws>"

lists:
  when:
    wildcard: true
  hours:
    range: {from: 1, to: 24}
  minutes:
    range: {from: 1, to: 600}
  seconds:
    range: {from: 1, to: 600}
  index:
    range: {from: 1, to: 50}
  time_hour:
    range: {from: 0, to: 23}
  time_minute:
    range: {from: 0, to: 59}
  meridiem:
    values:
      - {in: "am", out: "am"}
      - {in: "a m", out: "am"}
      - {in: "a.m.", out: "am"}
      - {in: "a. m.", out: "am"}
      - {in: "in the morning", out: "am"}
      - {in: "this morning", out: "am"}
      - {in: "pm", out: "pm"}
      - {in: "p m", out: "pm"}
      - {in: "p.m.", out: "pm"}
      - {in: "p. m.", out: "pm"}
      - {in: "in the afternoon", out: "pm"}
      - {in: "this afternoon", out: "pm"}
      - {in: "in the evening", out: "pm"}
      - {in: "this evening", out: "pm"}
      - {in: "tonight", out: "pm"}
      - {in: "at night", out: "pm"}
  named_time:
    values:
      - {in: "noon", out: "12:00"}
      - {in: "midday", out: "12:00"}
      - {in: "midnight", out: "00:00"}
  past_min:
    values:
      - {in: "half past", out: 30}
      - {in: "quarter past", out: 15}
  to_min:
    values:
      - {in: "quarter to", out: 45}
      - {in: "quarter til", out: 45}
      - {in: "quarter until", out: 45}
  ordinal:
    values:
      - {in: "first", out: 1}
      - {in: "1st", out: 1}
      - {in: "second", out: 2}
      - {in: "2nd", out: 2}
      - {in: "third", out: 3}
      - {in: "3rd", out: 3}
      - {in: "fourth", out: 4}
      - {in: "4th", out: 4}
      - {in: "fifth", out: 5}
      - {in: "5th", out: 5}
      - {in: "sixth", out: 6}
      - {in: "6th", out: 6}
      - {in: "seventh", out: 7}
      - {in: "7th", out: 7}
      - {in: "eighth", out: 8}
      - {in: "8th", out: 8}
      - {in: "ninth", out: 9}
      - {in: "9th", out: 9}
      - {in: "tenth", out: 10}
      - {in: "10th", out: 10}
